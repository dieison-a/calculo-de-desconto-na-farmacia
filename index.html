<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desconto da Farmácia</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <h1>Desconto da Farmácia</h1>

      <form action="calculaDesconto.php" method="post">
        <label for="valorCompra">Valor da compra (R$):</label>
        <input type="number" name="valorCompra" id="valorCompra" step="0.01" min="0" required />

        <br /><br />

        <label for="idade">Idade do cliente:</label>
        <input type="number" name="idade" id="idade" min="0" required />

        <br /><br />

        <p>Pagamento com cartão de fidelidade?</p>

        <span class="option">
          <input type="radio" name="cartao" id="cartaoSim" value="sim" required />
          <label for="cartaoSim">Sim</label>
        </span>

        <span class="option">
          <input type="radio" name="cartao" id="cartaoNao" value="nao" />
          <label for="cartaoNao">Não</label>
        </span>

        <br /><br />

        <input type="submit" value="Calcular" />

        <input type="reset" value="Limpar" />
      </form>
    </main>
  </body>
</html>
